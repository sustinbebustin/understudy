# Release configuration. Publishing is off until the maintainer turns it on
# (docs/release-runbook.md): the GitHub release is disabled, the images are
# pushed only when dockers_v2 is enabled outside snapshot, and the Homebrew
# cask upload is skipped.
version: 2

project_name: understudy

builds:
  - id: understudy
    main: ./cmd/understudy
    binary: understudy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: understudy
    ids: [understudy]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

# The images ship the binary built above, the one the archives and checksums
# describe: the Dockerfile's release target copies it from the build context
# instead of compiling again.
#
# dockers_v2 has no skip_push. Outside snapshot it runs one
# `docker buildx build --platform linux/amd64,linux/arm64 --push` per image
# and tag, so the registry gets one multi-arch manifest list. In snapshot it
# builds one image per platform into the local daemon and pushes nothing,
# because buildx cannot --load a manifest list. It is disabled outside
# snapshot until the maintainer enables publishing.
#
# sbom is off: the attestation (`--attest=type=sbom`) runs BuildKit's
# scanner image, an input the release does not otherwise pull, and the
# archive SBOMs (`sboms`) need syft. Either is the maintainer's decision.
dockers_v2:
  - id: understudy
    ids: [understudy]
    dockerfile: Dockerfile
    images:
      - ghcr.io/sustinbebustin/understudy
    # A prerelease does not move latest: GoReleaser drops a tag that renders
    # empty, as the cask's skip_upload: auto skips a prerelease.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - LICENSE
      - NOTICE
    build_args:
      VERSION: "{{ .Version }}"
    flags:
      - --target=release
    sbom: "false"
    disable: "{{ not .IsSnapshot }}"

# A cask, not a formula: `brews` is deprecated in GoReleaser v2.18. The cask
# is always written to dist/homebrew/Casks and never committed to the tap
# while skip_upload is "true". Its URLs point at the GitHub release, so the
# upload is turned on in the same change that enables the release: a token
# alone must not publish a cask whose downloads do not exist. The URL is
# spelled out because the GitHub release is disabled, so GoReleaser has no
# release to derive it from.
homebrew_casks:
  - name: understudy
    ids: [understudy]
    binaries: [understudy]
    description: Local AWS emulator for testing event-driven systems
    homepage: https://github.com/sustinbebustin/understudy
    url:
      template: "https://github.com/sustinbebustin/understudy/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    repository:
      owner: sustinbebustin
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    skip_upload: "true"

changelog:
  disable: true

release:
  disable: true
