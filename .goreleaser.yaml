# Release configuration. A v* tag publishes the GitHub release, the GHCR
# image and, when HOMEBREW_TAP_TOKEN is set and the tag is not a prerelease,
# the Homebrew cask (docs/release-runbook.md). A snapshot publishes nothing.
version: 2

project_name: understudy

builds:
  - id: understudy
    main: ./cmd/understudy
    binary: understudy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

# Optional signing: the darwin binaries ship unsigned, and the cask removes
# the quarantine attribute instead (homebrew_casks hooks below). If the
# maintainer ever joins the Apple Developer Program and adds the five
# MACOS_* repository secrets, this step signs them with the Developer ID
# certificate and has Apple notarize them, with quill on the Linux runner,
# before archiving. Without MACOS_SIGN_P12 it is skipped, as in the snapshot
# dry run. docs/release-runbook.md "macOS and Gatekeeper" has the steps.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [understudy]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: understudy
    ids: [understudy]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

# The images ship the binary built above, the one the archives and checksums
# describe: the Dockerfile's release target copies it from the build context
# instead of compiling again.
#
# dockers_v2 has no skip_push. Outside snapshot it runs one
# `docker buildx build --platform linux/amd64,linux/arm64 --push` per image
# and tag, so the registry gets one multi-arch manifest list. In snapshot it
# builds one image per platform into the local daemon and pushes nothing,
# because buildx cannot --load a manifest list.
#
# sbom is off: the attestation (`--attest=type=sbom`) runs BuildKit's
# scanner image, an input the release does not otherwise pull, and the
# archive SBOMs (`sboms`) need syft. Either is the maintainer's decision.
dockers_v2:
  - id: understudy
    ids: [understudy]
    dockerfile: Dockerfile
    images:
      - ghcr.io/sustinbebustin/understudy
    # A prerelease does not move latest: GoReleaser drops a tag that renders
    # empty, as the cask's skip_upload: auto skips a prerelease.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - LICENSE
      - NOTICE
    build_args:
      VERSION: "{{ .Version }}"
    flags:
      - --target=release
    sbom: "false"

# A cask, not a formula: `brews` is deprecated in GoReleaser v2.18. The cask
# is always written to dist/homebrew/Casks. It is committed to the tap only
# with HOMEBREW_TAP_TOKEN set, and auto skips a prerelease, so a release
# candidate never replaces the cask users install. Its URLs point at the
# GitHub release's assets.
homebrew_casks:
  - name: understudy
    ids: [understudy]
    binaries: [understudy]
    description: Local AWS emulator for testing event-driven systems
    homepage: https://github.com/sustinbebustin/understudy
    url:
      template: "https://github.com/sustinbebustin/understudy/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    repository:
      owner: sustinbebustin
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    # Homebrew quarantines what a cask downloads, and Gatekeeper refuses a
    # quarantined binary Apple has not notarized. Removing the attribute
    # after install trusts the binary on the strength of the HTTPS download
    # and the cask's sha256, as Homebrew formulae and LocalStack's lstk cask
    # do. Harmless if the binary is ever notarized.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/understudy"]
          end

# The release notes are the tag's section of CHANGELOG.md, which release.yml
# passes as --release-notes.
changelog:
  disable: true

release:
  prerelease: auto
