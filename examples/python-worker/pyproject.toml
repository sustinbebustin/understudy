[project]
name = "understudy-example-python-worker"
version = "0.1.0"
description = "A boto3 SQS worker tested against understudy"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
