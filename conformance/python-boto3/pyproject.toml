[project]
name = "understudy-conformance-python-boto3"
version = "0.0.0"
description = "boto3 conformance suite for the understudy local AWS emulator"
requires-python = ">=3.14"
dependencies = []

# Two mutually exclusive environments, both resolved into one uv.lock:
#   modern       the current boto3, which speaks the JSON protocol to SQS.
#   legacy-query the last botocore that speaks the Query protocol to SQS
#                (1.34.89; sqs.md 2.2: the JSON switch is final from 1.34.90).
[dependency-groups]
modern = [
    "boto3>=1.43",
    "pytest>=9",
    "pytest-timeout>=2.4",
]
legacy-query = [
    "boto3==1.34.89",
    "botocore==1.34.89",
    "pytest>=9",
    "pytest-timeout>=2.4",
]

[tool.uv]
package = false
default-groups = ["modern"]
conflicts = [
    [{ group = "modern" }, { group = "legacy-query" }],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 180
markers = [
    "docker: needs the Docker daemon (DynamoDB Local, Lambda containers)",
    "dynamodb: talks to DynamoDB; skips under CONFORMANCE_DYNAMODB=0",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]
