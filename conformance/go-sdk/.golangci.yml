version: "2"

# The go-sdk conformance suite, a module of its own (conformance/README.md).
# The linters are the Go Testcontainers module's (testcontainers/go/.golangci.yml)
# without depguard and forbidigo: an import allow-list and a stdout ban do not
# fit a test suite.
run:
  go: "1.27"
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - noctx
    - contextcheck
    - durationcheck
    - errorlint
    - exhaustive
    - gochecksumtype
    - forcetypeassert
    - nilerr
    - nilnesserr
    - nilnil
    - makezero
    - reassign
    - copyloopvar
    - fatcontext
    - recvcheck
    - gosec
    - errchkjson
    - nosprintfhostport
    - canonicalheader
    - usestdlibvars
    - gocheckcompilerdirectives
    - bidichk
    - errname
    - revive
    - gocritic
    - unparam
    - unconvert
    - predeclared
    - perfsprint
    - prealloc
    - intrange
    - modernize
    - misspell
    - dupword
    - godot
    - godox
    - nolintlint
    - gochecknoinits
    - gochecknoglobals
    - iface
    - funcorder
    - containedctx
    - thelper
    - tparallel
    - usetesting
    - gomoddirectives
    - gocognit
    - nestif
  settings:
    # Cleanups discard their errors with `_, _ =` on purpose: they are best
    # effort, a test may already have deleted the resource, and run.sh removes
    # the data directory afterwards. errcheck still refuses an error dropped
    # without the explicit blank.
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    exhaustive: { default-signifies-exhaustive: false }
    gochecksumtype: { default-signifies-exhaustive: false }
    godox: { keywords: [TODO, FIXME, HACK, XXX] }
    nolintlint: { require-explanation: true, require-specific: true }
    godot: { scope: toplevel, capital: false }
    gocognit: { min-complexity: 20 }
    nestif: { min-complexity: 5 }
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks: [hugeParam, ptrToRefParam]
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: context-as-argument
        - name: context-keys-type
        - name: indent-error-flow
        - name: unexported-return
        - name: blank-imports
        - name: receiver-naming
        - name: var-naming
        - name: unused-parameter
        - name: useless-break
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: strict
    presets: [std-error-handling, common-false-positives]
    rules:
      - path: _test\.go
        linters: [gochecknoglobals, gocognit, nestif, forcetypeassert]
      # Helpers take their context from t.Context(), and cleanups use
      # context.Background() because t.Context() is cancelled before cleanups
      # run; neither is a context the caller should pass.
      - path: _test\.go
        linters: [contextcheck]
      # Each test runs in parallel with the others; its subtests are ordered
      # steps on the resources the test created, so they run in sequence.
      - path: _test\.go
        linters: [tparallel]
      # S3's Content-MD5 and ETags and SQS's MD5OfMessageBody and
      # MD5OfMessageAttributes are MD5 by protocol.
      - path: _test\.go
        linters: [gosec]
        text: G401|G501
      # The files and URLs the suite opens come from run.sh's environment
      # (AWS_CA_BUNDLE, the IAM loop's policy directory) and from understudy's
      # own answers on its loopback endpoint.
      - path: _test\.go
        linters: [gosec]
        text: G703|G704

formatters:
  enable: [gofumpt, goimports]
  settings:
    gofumpt: { extra: { group-params: true } }
    goimports: { local-prefixes: [github.com/sustinbebustin/understudy] }

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
