name: prepare-release

# Opens the pull request for a release: scripts/bump-version moves every
# version pin to the version given and cuts CHANGELOG.md, and
# scripts/repin-runtime-images re-pins the Lambda runtime images to the index
# digests public.ecr.aws serves that day, so ci.yml's test-docker tests the
# new pins before the tag. Merge it, then push the tag vX.Y.Z from the merge
# commit; the tag runs release.yml.
#
# A pull request opened with this workflow's token starts no pull_request
# run, so the job dispatches ci.yml on the branch: its jobs report on the
# same commit, which is what the required checks look for.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release, X.Y.Z without the v"
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Bump the pins and cut the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/bump-version "$VERSION"
      - name: Re-pin the Lambda runtime images
        run: scripts/repin-runtime-images > "$RUNNER_TEMP/pins.md"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "build: release $VERSION"
          git push origin "$branch"
          notes=$(awk -v h="## [$VERSION]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md)
          pins=$(cat "$RUNNER_TEMP/pins.md")
          # shellcheck disable=SC2016 # the backticks are Markdown
          intro=$(printf 'Moves every version pin to %s and cuts CHANGELOG.md (scripts/bump-version). After merging, push the tag from the merge commit:\n\n```sh\ngit switch main && git pull --ff-only\ngit tag -a v%s -m "understudy v%s" && git push origin v%s\n```\n\n## Runtime image pins\n\n%s' "$VERSION" "$VERSION" "$VERSION" "$VERSION" "$pins")
          body=$(printf '%s\n\n## Release notes\n\n%s\n' "$intro" "$notes")
          # GitHub refuses a pull request body over 65536 characters, after
          # the branch is pushed. Notes that long stay in CHANGELOG.md.
          if [ "${#body}" -gt 60000 ]; then
            # shellcheck disable=SC2016 # the backticks are Markdown
            body=$(printf '%s\n\n## Release notes\n\nToo long for a pull request body. They are the `[%s]` section of CHANGELOG.md on this branch.\n' "$intro" "$VERSION")
          fi
          gh pr create --base main --head "$branch" --title "build: release $VERSION" --body "$body"
          gh workflow run ci.yml --ref "$branch"
