name: ci

on:
  push:
    branches: [main]
  pull_request:
  # prepare-release.yml dispatches it on the release branch, whose pull
  # request, opened with the workflow's token, starts no pull_request run.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run of the one before it. Runs
# on main, and the release branch's dispatched run, each finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Saves the race cache (.github/actions/go-cache) that test-docker reads
  # too: it runs vet, the linters and every package's tests under -race.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          group: race
      # install-only runs no linter, so the action's own cache would hold
      # nothing; golangci-lint's cache travels in the race cache.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
          skip-cache: true
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: just verify
      - run: just sealed-test
      - if: github.event_name == 'push'
        uses: ./.github/actions/go-cache
        with:
          group: race
          mode: save

  # Lints the conformance suites and the example modules, which verify's
  # golangci-lint does not reach (just lint-suites): golangci-lint in each Go
  # module with its own .golangci.yml, ruff over the boto3 suite and
  # shellcheck over the suites' shell scripts. ruff and shellcheck come
  # through uvx at the versions the recipe pins. No AWS and no understudy.
  lint-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: just lint-suites

  # Regenerates every generated package from the vendored models, corpus,
  # actions table and overlays, and fails when the result differs from what
  # is checked in (ARCHITECTURE.md 5.7).
  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just generate-check

  # Rebuilds the web UI with the pinned bun (just ui: the label table from
  # the Go enumerations, the UI's bun tests, the minified build the binary
  # embeds) and fails when internal/server/ui/dist or ui/src/labels.gen.ts
  # differs from what is checked in.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      # The justfile's bun_version; TestBunPinMatchesCI keeps the two equal.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just ui-check

  # Runs the Smithy protocol compliance corpus against the synthetic services
  # and fails when a case recorded in internal/protocoltest/baseline.json
  # regresses, when a passing case is missing from it, or when a failing
  # case has no entry in skips.json (ARCHITECTURE.md 6.4). Fixing a case
  # means rewriting the baseline with just protocoltest-baseline.
  protocoltest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - run: go test -race -run 'TestCorpus' -v ./internal/protocoltest

  # Regenerates docs/coverage.md from the wired emulator, the baseline and
  # the overlays, and fails when it is untracked or differs from what is
  # checked in.
  coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just coverage-check

  # Binary size, startup, idle RSS, cold build and lint wall time against the
  # ceilings of ARCHITECTURE.md 5.7, on the CI runner they are defined for.
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just budgets

  # Builds the binary, starts it with the TLS listener and drives one raw
  # HTTP request per service (ARCHITECTURE.md 19, smoke row).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just smoke

  # The tests that need a Docker daemon: Lambda execution, DynamoDB Local,
  # the container topology and the image contract, in the packages whose
  # tests the docker tag changes; verify runs every other package's. The
  # runner's daemon listens at /var/run/docker.sock.
  #
  # DynamoDB Local runs here and in conformance. The repository owner is its
  # licensee for this workflow (ADR 0014, amendment of 2026-10-14). The
  # image is pulled by digest only: never cache, upload or push it.
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          group: race
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      # The tests run behind a dead proxy, which also reaches the docker
      # CLI, so TestImage's build cannot fetch a registry token for the
      # Dockerfile's golang stages. Pulled here, the digest-pinned base
      # resolves from the daemon's store instead.
      - name: Pull the image's golang base
        run: |
          # shellcheck disable=SC2016 # $BUILDPLATFORM is the Dockerfile's text
          docker pull "$(sed -n 's/^FROM --platform=$BUILDPLATFORM \(golang:[^ ]*\) AS builder$/\1/p' Dockerfile)"
      - run: just test-docker

  # Builds the image, then runs the smoke workload with a Lambda invoke
  # against the binary and against understudy inside the image with the
  # Docker socket mounted, the InContainer topology.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just image
      - run: go test -race -tags 'smoke docker' ./internal/smoke/...

  # The release dry run (just release-check): goreleaser check, then a
  # snapshot release with publishing skipped, so a change that breaks the
  # release configuration fails here rather than on a tag. It builds the
  # four binaries, archives, checksums, both image platforms and the
  # Homebrew cask, and publishes nothing.
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser reads the version from the latest tag.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just release-check

  # Runs every example the way its README does (examples/check.sh): each
  # demo.sh, and the github-actions workflow linted and its steps replayed
  # locally, against understudy built from this commit. The runner provides
  # Docker with compose, the AWS CLI v2 and jq; Terraform's wrapper is off
  # because the examples read terraform output themselves.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          group: build
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: examples/check.sh

  # Runs each real-client conformance suite's run.sh against understudy built
  # from this commit, one matrix entry per suite (ARCHITECTURE.md 19), and
  # lets every suite finish when another fails. Every suite runs DynamoDB's
  # tests on DynamoDB Local, licensed as for test-docker above.
  #
  # Each suite runs under its run.sh's default --sigv4 mode (an empty SIGV4).
  # terraform and js-sdk-v3 run a second time under verify, as aws-cli does
  # in its own jobs below, so signature verification is checked against
  # every signer the suites use, not only boto3's (conformance/README.md,
  # Signature checking). sigv4 is a matrix axis so that each include adds a
  # job instead of changing the suite's existing one.
  #
  # The terraform job saves the build cache (.github/actions/go-cache) that
  # every job building the binary reads.
  conformance:
    name: conformance (${{ matrix.suite }}${{ matrix.sigv4 && format(', SIGV4={0}', matrix.sigv4) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [go-sdk, python-boto3, js-sdk-v3, terraform, e2e-pipeline]
        sigv4: [""]
        include:
          - suite: terraform
            sigv4: verify
          - suite: js-sdk-v3
            sigv4: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          group: build
      - uses: astral-sh/setup-uv@v10.2.0
      # The version conformance/js-sdk-v3/bun.lock resolves bun-types to.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false
      - run: conformance/${{ matrix.suite }}/run.sh
        env:
          SIGV4: ${{ matrix.sigv4 }}
      - if: github.event_name == 'push' && matrix.suite == 'terraform' && matrix.sigv4 == ''
        uses: ./.github/actions/go-cache
        with:
          group: build
          mode: save

  # The AWS CLI suite, the longest by far: the CLI takes about a second of
  # CPU per call and the suite makes thousands. Each mode's tests are dealt
  # to three jobs (CONFORMANCE_SHARD), and each job deals its share to one
  # understudy server per CPU (CONFORMANCE_JOBS, conformance/aws-cli/run.sh).
  conformance-aws-cli:
    name: conformance (aws-cli${{ matrix.sigv4 && format(', SIGV4={0}', matrix.sigv4) || '' }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sigv4: ["", verify]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          group: build
      - uses: astral-sh/setup-uv@v10.2.0
      - run: CONFORMANCE_JOBS="$(nproc)" conformance/aws-cli/run.sh
        env:
          SIGV4: ${{ matrix.sigv4 }}
          CONFORMANCE_SHARD: ${{ matrix.shard }}/3

  # Reports the aws-cli shards under the names the suite's two jobs had
  # before it was sharded, which main's ruleset requires. Each fails unless
  # every shard of both modes passed; always() keeps a failed shard from
  # skipping it, since a skipped required check counts as passed.
  conformance-aws-cli-result:
    name: conformance (aws-cli${{ matrix.sigv4 && format(', SIGV4={0}', matrix.sigv4) || '' }})
    if: ${{ always() }}
    needs: conformance-aws-cli
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sigv4: ["", verify]
    steps:
      - name: Require every aws-cli shard to have passed
        run: |
          if [ "$RESULT" != success ]; then
            echo "The aws-cli conformance shards ended as '$RESULT', not success; see the jobs named 'conformance (aws-cli, ..., shard K/3)' in this run." >&2
            exit 1
          fi
        env:
          RESULT: ${{ needs.conformance-aws-cli.result }}

  # Builds understudy:dev once, then lints and tests each Testcontainers
  # module against it with the module's run.sh (testcontainers.md 8.7). Each
  # suite runs when another fails, as the conformance matrix lets every suite
  # finish. The libraries pull their Ryuk images from Docker Hub
  # (testcontainers/ryuk:0.14.0 for Go and Node, 0.8.1 for Python), and
  # understudy pulls the Lambda base image for the Lambda cases.
  testcontainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
      # The bun that wrote testcontainers/node/bun.lock; the tests run on Node.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.3"
      - id: image
        run: just image
      - if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: testcontainers/go/run.sh
      - if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: testcontainers/python/run.sh
      - if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: testcontainers/node/run.sh
