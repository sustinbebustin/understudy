name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: just verify
      - run: just sealed-test

  # Regenerates every generated package from the vendored models, corpus,
  # actions table and overlays, and fails when the result differs from what
  # is checked in (ARCHITECTURE.md 5.7).
  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just generate-check

  # Runs the Smithy protocol compliance corpus against the synthetic services
  # and fails when a case recorded in internal/protocoltest/baseline.json
  # regresses, when a passing case is missing from it, or when a failing
  # case has no entry in skips.json (ARCHITECTURE.md 6.4). Fixing a case
  # means rewriting the baseline with just protocoltest-baseline.
  protocoltest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - run: go test -race -run 'TestCorpus' -v ./internal/protocoltest

  # Regenerates docs/coverage.md from the wired emulator, the baseline and
  # the overlays, and fails when it is untracked or differs from what is
  # checked in.
  coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just coverage-check

  # Binary size, startup, idle RSS, cold build and lint wall time against the
  # ceilings of ARCHITECTURE.md 5.7, on the CI runner they are defined for.
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just budgets

  # Builds the binary, starts it with the TLS listener and drives one raw
  # HTTP request per service (ARCHITECTURE.md 19, smoke row).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just smoke

  # The tests that need a Docker daemon: Lambda execution, DynamoDB Local,
  # the container topology and the image contract. The runner's daemon
  # listens at /var/run/docker.sock.
  #
  # DynamoDB Local runs here and in conformance. The repository owner is its
  # licensee for this workflow (ADR 0014, amendment of 2026-10-14). The
  # image is pulled by digest only: never cache, upload or push it.
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just test-docker

  # Builds the image, then runs the smoke workload with a Lambda invoke
  # against the binary and against understudy inside the image with the
  # Docker socket mounted, the InContainer topology.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - run: just image
      - run: go test -race -tags 'smoke docker' ./internal/smoke/...

  # Runs every example the way its README does (examples/check.sh): each
  # demo.sh, and the github-actions workflow linted and its steps replayed
  # locally, against understudy built from this commit. The runner provides
  # Docker with compose, the AWS CLI v2 and jq; Terraform's wrapper is off
  # because the examples read terraform output themselves.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: examples/check.sh

  # Runs each real-client conformance suite's run.sh against understudy built
  # from this commit, one matrix entry per suite (ARCHITECTURE.md 19), and
  # lets every suite finish when another fails. Every suite runs DynamoDB's
  # tests on DynamoDB Local, licensed as for test-docker above.
  #
  # Each suite runs under its run.sh's default --sigv4 mode (an empty SIGV4).
  # aws-cli, terraform and js-sdk-v3 run a second time under verify, so
  # signature verification is checked against every signer the suites use,
  # not only boto3's (conformance/README.md, Signature checking). sigv4 is a
  # matrix axis so that each include adds a job instead of changing the
  # suite's existing one.
  conformance:
    name: conformance (${{ matrix.suite }}${{ matrix.sigv4 && format(', SIGV4={0}', matrix.sigv4) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [go-sdk, python-boto3, js-sdk-v3, aws-cli, terraform, e2e-pipeline]
        sigv4: [""]
        include:
          - suite: aws-cli
            sigv4: verify
          - suite: terraform
            sigv4: verify
          - suite: js-sdk-v3
            sigv4: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - uses: astral-sh/setup-uv@v10.2.0
      # The version conformance/js-sdk-v3/bun.lock resolves bun-types to.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false
      - run: conformance/${{ matrix.suite }}/run.sh
        env:
          SIGV4: ${{ matrix.sigv4 }}
