name: release

# A dry run of the release: GoReleaser builds the archives, checksums and
# multi-arch images in snapshot mode and nothing is published. The artifacts
# are attached to this workflow run only.
#
# Every action is pinned to a commit, with its release in the trailing
# comment, so a moved tag cannot change what a release run executes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No later step needs git credentials; keep the token out of
          # .git/config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Pinned: the no-push guarantee rests on dockers_v2 semantics of
          # this release; bump deliberately.
          version: v2.18.3
          args: release --snapshot --clean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
