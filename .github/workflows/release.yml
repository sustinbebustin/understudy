name: release

# Runs GoReleaser on a v* tag: the GitHub release with the archives and
# checksums, the multi-arch GHCR image, and the Homebrew cask when the
# HOMEBREW_TAP_TOKEN secret exists and the tag is not a prerelease. The
# release notes are the tag's section of CHANGELOG.md
# (docs/release-runbook.md). The archives, checksums and cask are also
# attached to this workflow run.
#
# The dry run on every pull request is ci.yml's release-check job.
#
# Every action is pinned to a commit, with its release in the trailing
# comment, so a moved tag cannot change what a release run executes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Write access exists only here, on the tag trigger: contents for the
    # GitHub release, packages for the GHCR image.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No later step needs git credentials; keep the token out of
          # .git/config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A release candidate may go out before its version is cut, so a
      # prerelease tag without a section of its own takes [Unreleased].
      # Checked before anything is published.
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v h="## [$1]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md
          }
          notes=$(section "$version")
          if [ -z "${notes//[[:space:]]/}" ] && [[ "$version" == *-* ]]; then
            notes=$(section Unreleased)
          fi
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::CHANGELOG.md has no notes for $version. Move [Unreleased] under '## [$version] - <date>' and tag again."
            exit 1
          fi
          printf '%s\n' "$notes" >"$RUNNER_TEMP/release-notes.md"
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Pinned: the publish gates rest on dockers_v2 and homebrew_casks
          # semantics of this release (install_steps needs v2.19 or later);
          # the justfile's goreleaser_version
          # matches. Bump both deliberately.
          version: v2.19.0
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without the secret it is empty, which keeps the cask out of the
          # tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Optional: when set, the darwin binaries are signed and notarized
          # (.goreleaser.yaml notarize); unset, they ship unsigned.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/homebrew/Casks/understudy.rb
          if-no-files-found: error

  # The Testcontainers modules, in lockstep with the release and only once
  # its image exists, since each module's default image is the release's
  # (testcontainers.md 8.8). A prerelease publishes none of them. PyPI and npm
  # trust this workflow file through OIDC (trusted publishing), so there is
  # no registry token.
  pypi:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: testcontainers/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The package version is the tag's
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::testcontainers/python is $version, the tag $GITHUB_REF_NAME; bump the modules in lockstep (docs/release-runbook.md 2)."
            exit 1
          fi
      - run: uv build
      # --check-url skips files PyPI already has, so a rerun succeeds.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

  npm:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: testcontainers/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # The bun that wrote bun.lock.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: The package version is the tag's
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::testcontainers/node is $version, the tag $GITHUB_REF_NAME; bump the modules in lockstep (docs/release-runbook.md 2)."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2
      # npm configures trusted publishing only for a package that exists, so
      # the first version was published by hand; a version already on the
      # registry is skipped, which also makes a rerun succeed.
      - name: Publish unless the version exists
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "testcontainers-understudy@$version" version >/dev/null 2>&1; then
            echo "testcontainers-understudy@$version is already on npm"
          else
            npm publish --access public
          fi

  # The Go module is a tag on the same commit. Pushed with this token, it
  # starts no workflow.
  go-module:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: The module requires this release
        run: |
          required=$(cd testcontainers/go && go list -m -f '{{.Version}}' github.com/sustinbebustin/understudy)
          if [ "$required" != "$GITHUB_REF_NAME" ]; then
            echo "::error::testcontainers/go requires understudy $required, the tag is $GITHUB_REF_NAME; bump the modules in lockstep (docs/release-runbook.md 2)."
            exit 1
          fi
      - name: Tag testcontainers/go
        run: |
          tag="testcontainers/go/$GITHUB_REF_NAME"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
      - name: A consumer resolves it
        run: |
          cd "$(mktemp -d)"
          go mod init example.com/probe
          go get "github.com/sustinbebustin/understudy/testcontainers/go@$GITHUB_REF_NAME"
          test "$(go list -m -f '{{.Version}}' github.com/sustinbebustin/understudy)" = "$GITHUB_REF_NAME"
